<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pages only talk to Anthropic. The manifest also allows https: so background.js can read
       a company's site for research, with the per-site permission you grant. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://api.anthropic.com">
  <title>JobScript</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>JobScript</h1>
    <button id="open-options" class="link" type="button">Edit profile</button>
  </header>

  <div id="panel-fill">
    <p id="profile-status" class="muted"></p>

    <button id="fill" class="primary" type="button">Fill this page</button>
    <button id="job" class="secondary wide" type="button">Job description &amp; my resume</button>
    <button id="tailor" class="link tailor-link" type="button">Or let Claude tailor your resume</button>
    <button id="learn" class="link tailor-link" type="button" hidden>Learn this site’s steps</button>
    <p class="muted shortcut">Shortcut: <kbd id="shortcut">Alt+Shift+F</kbd></p>

    <div id="result" class="result" hidden></div>

    <p class="muted footnote">JobScript never submits. Review every field, then submit yourself.</p>
  </div>

  <div class="tracker-row">
    <span id="today-progress" class="muted"></span>
    <button id="open-tracker" class="link" type="button">Open tracker</button>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
