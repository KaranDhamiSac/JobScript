<!doctype html><html><head><meta charset="utf-8"><title>Job Application for Data Analyst at Example Co</title>
<!-- Mock form A for canonical answers: the same questions as mock-wordings-b.html, worded and
     formatted differently. No JobScript scripts here: load the extension and use Fill (or the
     test copy described in README "Testing"). -->
<style>body{font:14px sans-serif;max-width:640px;margin:20px auto} label{display:block;margin-top:12px;font-weight:600} input,select,textarea{display:block;width:100%;margin-top:4px}</style>
</head><body><h1>Data Analyst</h1>
<form id="application-form">
<label for="fn">First name</label><input id="fn">
<label for="ln">Last name</label><input id="ln">
<label for="em">Email</label><input id="em" type="email">
<label for="grad">Expected graduation date</label><input id="grad" placeholder="MM/YYYY">
<label for="heard">How did you hear about us?</label>
<select id="heard"><option value="">Select…</option><option>LinkedIn</option><option>Handshake</option><option>Career fair</option><option>Friend or colleague</option><option>Other</option></select>
<fieldset><legend>Are you legally authorized to work in the United States?</legend>
<label><input type="radio" name="auth" value="yes">Yes</label><label><input type="radio" name="auth" value="no">No</label></fieldset>
<label for="lang">What languages do you speak?</label><input id="lang">
<label for="sal">Desired salary</label><input id="sal">
<label for="start">Available start date</label><input id="start" type="date">
<label for="why">Why do you want to work at Example Co?</label><textarea id="why"></textarea>
</form></body></html>
