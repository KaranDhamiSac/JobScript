<!doctype html><html><head><meta charset="utf-8"><title>Job Application for Operations Analyst at Northwind</title>
<!-- Mock form B for canonical answers: see mock-wordings-a.html. -->
<style>body{font:14px sans-serif;max-width:640px;margin:20px auto} label{display:block;margin-top:12px;font-weight:600} input,select,textarea{display:block;width:100%;margin-top:4px}</style>
</head><body><h1>Operations Analyst</h1>
<form id="application-form">
<label for="name">Full name</label><input id="name">
<label for="mail">E-mail address</label><input id="mail">
<label for="when">When do you graduate?</label><input id="when" placeholder="e.g. May 2027">
<label for="gy">Graduation year</label><select id="gy"><option value="">Year</option><option>2025</option><option>2026</option><option>2027</option><option>2028</option></select>
<label for="gm">Graduation month</label><select id="gm"><option value="">Month</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
<label for="find">Where did you find this job posting?</label><input id="find">
<label for="elig">Are you eligible to work in the US?</label><select id="elig"><option value="">Choose</option><option>Yes</option><option>No</option></select>
<label for="langs">Languages spoken</label><input id="langs">
<label for="exp">What are your salary expectations?</label><input id="exp">
<label for="when2">When can you start?</label><input id="when2" placeholder="mm/dd/yyyy">
<fieldset><legend>Referral source</legend>
<label><input type="radio" name="src" value="board">Job board</label><label><input type="radio" name="src" value="li">LinkedIn</label><label><input type="radio" name="src" value="emp">Employee referral</label></fieldset>
<label for="whyrole">Why this role?</label><textarea id="whyrole"></textarea>
</form></body></html>
